<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search city (e.g., London, Tokyo, New York)..."
                    autocomplete="off"
                >
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </header>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- Main Weather Display -->
        <div id="mainWeather" class="main-weather hidden">
            <div class="current-weather">
                <div class="location-info">
                    <h2 id="cityName"></h2>
                    <p id="dateTime"></p>
                </div>
                <div class="weather-main">
                    <div class="temp-display">
                        <span id="temperature" class="temp"></span>
                        <span class="unit">°C</span>
                    </div>
                    <div class="weather-icon-large">
                        <i id="weatherIcon" class="fas fa-cloud"></i>
                    </div>
                </div>
                <p id="weatherDescription" class="weather-desc"></p>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-tint"></i> Humidity</span>
                    <span id="humidity" class="detail-value"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-wind"></i> Wind Speed</span>
                    <span id="windSpeed" class="detail-value"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-eye"></i> Visibility</span>
                    <span id="visibility" class="detail-value"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-compress"></i> Pressure</span>
                    <span id="pressure" class="detail-value"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-arrow-up"></i> Feels Like</span>
                    <span id="feelsLike" class="detail-value"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-sun"></i> UV Index</span>
                    <span id="uvIndex" class="detail-value"></span>
                </div>
            </div>
        </div>

        <!-- Hourly Forecast -->
        <div id="hourlySection" class="forecast-section hidden">
            <h3><i class="fas fa-clock"></i> Hourly Forecast</h3>
            <div id="hourlyForecast" class="forecast-grid"></div>
        </div>

        <!-- 7-Day Forecast -->
        <div id="dailySection" class="forecast-section hidden">
            <h3><i class="fas fa-calendar-days"></i> 7-Day Forecast</h3>
            <div id="dailyForecast" class="forecast-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
